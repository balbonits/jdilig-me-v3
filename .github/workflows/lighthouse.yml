# Scores www.jdilig.me with Lighthouse (desktop) from a GitHub runner.
# Start it by hand: Actions tab → Lighthouse → Run workflow. It also runs
# on any push that changes the scoring script or this file, so a broken
# script shows up as a failed run. The job log prints the new
# src/data/lighthouse.json, and the same file is attached to the run as
# the "lighthouse" artifact. Commit it to update the scores shown on the
# jdilig.me project page.
name: Lighthouse

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/lighthouse.mjs
      - .github/workflows/lighthouse.yml

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lighthouse
      - name: Print results
        run: cat src/data/lighthouse.json
      - uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: src/data/lighthouse.json
